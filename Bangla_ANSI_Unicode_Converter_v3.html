<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>বাংলা ফন্ট কনভার্টার V3 | Bangla Haraf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --accent: #60a5fa;
      --text: #172033;
      --muted: #64748b;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --dark: #0f172a;
      --dark-card: #1e293b;
      --radius: 16px;
      --max-width: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Hind Siliguri", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: var(--bg);
      transition: background-color 0.2s ease, color 0.2s ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      width: min(var(--max-width), calc(100% - 32px));
      margin: auto;
    }

    /* Transparent Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      white-space: nowrap;
      text-decoration: none;
      color: var(--text);
    }

    .logo-mark {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      color: white;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      font-size: 21px;
    }

    .logo small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 1px;
    }

    .theme-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 10px;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    /* Converter Main Layout */
    .converter-section {
      padding: 40px 0;
      flex: 1;
    }

    .converter-title {
      text-align: center;
      margin-bottom: 30px;
    }

    .converter-title h1 {
      font-size: 2rem;
      margin: 0 0 8px 0;
    }

    .converter-title p {
      color: var(--muted);
      margin: 0;
    }

    .converter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .converter-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      height: 260px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 16px;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: var(--primary);
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      background: var(--primary);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: var(--primary-dark);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-outline:hover {
      background: var(--border);
    }

    /* Dark Mode Overrides */
    body.dark {
      --text: #e5e7eb;
      --muted: #94a3b8;
      --bg: #0b1120;
      --card: #172033;
      --border: #334155;
    }

    body.dark .header {
      background: rgba(15, 23, 42, 0.8);
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="index.html">
        <span class="logo-mark">ব</span>
        <span>বাংলা হরফ<small>BANGLAHARAF FONT FOUNDRY</small></span>
      </a>

      <button class="theme-btn" onclick="toggleTheme()" title="Dark / Light">◐</button>
    </div>
  </header>

  <main class="converter-section">
    <div class="container">
      <div class="converter-title">
        <h1>ইউনিকোড টু বিজয় ফন্ট কনভার্টার (V3)</h1>
        <p>সহজেই ইউনিকোড এবং বিজয়ের মধ্যে রূপান্তর করুন</p>
      </div>

      <div class="converter-grid">
        <!-- Input Card -->
        <div class="card">
          <div class="card-header">
            <span>ইউনিকোড / টেক্সট ইনপুট</span>
            <button class="btn btn-outline" onclick="clearInput()">মুছে ফেলুন</button>
          </div>
          <textarea id="inputText" placeholder="এখানে ইউনিকোড টেক্সট লিখুন বা পেস্ট করুন..."></textarea>
          <div class="actions">
            <button class="btn" onclick="convertV3()">রূপান্তর করুন</button>
          </div>
        </div>

        <!-- Output Card -->
        <div class="card">
          <div class="card-header">
            <span>বিজয় আউটপুট</span>
            <button class="btn btn-outline" onclick="copyOutput()">কপি করুন</button>
          </div>
          <textarea id="outputText" readonly placeholder="রূপান্তরিত ফলাফল এখানে দেখাবে..."></textarea>
        </div>
      </div>
    </div>
  </main>

  <script>
    function toggleTheme() {
      document.body.classList.toggle("dark");
      localStorage.setItem(
        "fontHubTheme",
        document.body.classList.contains("dark") ? "dark" : "light"
      );
    }

    document.addEventListener("DOMContentLoaded", () => {
      if (localStorage.getItem("fontHubTheme") === "dark") {
        document.body.classList.add("dark");
      }
    });

    function convertV3() {
      const input = document.getElementById("inputText").value;
      // Conversion logic placeholder for V3
      document.getElementById("outputText").value = input;
    }

    function clearInput() {
      document.getElementById("inputText").value = "";
      document.getElementById("outputText").value = "";
    }

    function copyOutput() {
      const output = document.getElementById("outputText");
      output.select();
      document.execCommand("copy");
    }
  </script>
</body>
</html>
