    if(i<s.length && isPreKar(s.charAt(i))){
      let n=1;
      while(isBanjon(s.charAt(i-n))){
        if(i-n<0) break;
        if(i-n<=lastMoved) break;
        if(isHalant(s.charAt(i-n-1))) n+=2; else break;
      }
      s=s.substring(0,i-n)+s.charAt(i)+s.substring(i-n,i)+s.substring(i+1);
      lastMoved=i+1; continue;
    }
    if(i<s.length-1 && isHalant(s.charAt(i)) && s.charAt(i-1)==='র' && !isHalant(s.charAt(i-2))){
      let n=1, extra=0;
      while(true){
        if(isBanjon(s.charAt(i+n)) && isHalant(s.charAt(i+n+1))) n+=2;
        else if(isBanjon(s.charAt(i+n)) && isPreKar(s.charAt(i+n+1))){extra=1;break}

      }
      s=s.substring(0,i-1)+s.substring(i+n+1,i+n+extra+1)+s.substring(i+1,i+n+1)+s.charAt(i-1)+s.charAt(i)+s.substring(i+n+extra+1);
      i+=n+extra; lastMoved=i+1;
    }

}
function htmlSafeToUnicode(s){
  return s.replace(/&#([0-9A-Fa-f]{4});/g,(_,h)=>String.fromCharCode(parseInt(h,16)));
}
function unicodeToHtmlSafe(s){
  let out=''; for(let i=0;i<s.length;i++){const c=s.charAt(i); if(c.charCodeAt(0)<128) out+=c; else out+='&#'+c.charCodeAt(0).toString(16).toUpperCase().padStart(4,'0')+';';} return out;
}
function applyMap(s,map){
  for(const key in map) s=s.replace(new RegExp(key,'g'),map[key]);
  return s;
}
function convertAnsiToUnicode(text){
  text=htmlSafeToUnicode(text);
  text=applyMap(text,ANSI_TO_UNICODE);
  text=rearrangeUnicodeConvertedText(text);

  text=text.replace(/অা/g,'আ');

}
function convertUnicodeToAnsi(text){
  text=htmlSafeToUnicode(text);
  // V3's reverse algorithm deliberately decomposes these visual vowel signs.
  // This is the critical V4 handling: do NOT run অা→আ here.
  text=text.replace(/ো/g,'ো');
  text=text.replace(/ৌ/g,'ৌ');
  text=rearrangeUnicodeText(text);
  return applyMap(text,UNICODE_TO_ANSI);
}
const input=document.getElementById('input'), output=document.getElementById('output'), status=document.getElementById('status'), ansiFont=document.getElementById('ansiFont');
let direction='a2u';
function render(){output.classList.toggle('ansi',direction==='u2a');output.classList.toggle('unicode',direction==='a2u');output.style.fontFamily=direction==='u2a' ? ansiFont.value+', monospace' : "RuposhiUnicode, 'Noto Sans Bengali', sans-serif";}
function convert(){try{output.value=direction==='a2u'?convertAnsiToUnicode(input.value):convertUnicodeToAnsi(input.value);status.textContent=direction==='a2u'?'ANSI → Unicode completed.':'Unicode → ANSI completed. ো/ৌ were handled as ো/ৌ before the legacy map; no extra আ normalization is applied.';render();}catch(e){status.textContent='Conversion error: '+e.message;}}
document.getElementById('a2u').onclick=()=>{direction='a2u';convert()};document.getElementById('u2a').onclick=()=>{direction='u2a';convert()};
