<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="perfect typist unicode font converter, perfect typist ansi to unicode converter online, perfect typist bangla font converter">
<title>Bangla ANSI ↔ Unicode Converter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   HEADER & GLOBAL THEME STYLES
   ========================================================= */
:root{
  --primary:#2563eb;
  --primary-dark:#1d4ed8;
  --accent:#60a5fa;
  --text:#172033;
  --muted:#64748b;
  --bg:#f8fafc;
  --card:#ffffff;
  --border:#e2e8f0;
  --dark:#0f172a;
  --dark-card:#1e293b;
  --radius:16px;
  --max-width:1180px;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family: "Hind Siliguri", sans-serif;
  font-weight: 400;
  color:var(--text);
  background:var(--bg);
  line-height:1.6;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}

.container{
  width:min(var(--max-width),calc(100% - 32px));
  margin:auto;
}

/* Header */
.header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--border);
}
.header-inner{
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  white-space:nowrap;
}
.logo-mark{
  width:40px;height:40px;
  display:grid;place-items:center;
  border-radius:12px;
  color:white;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  font-size:21px;
}
.logo small{
  display:block;
  color:var(--muted);
  font-size:10px;
  letter-spacing:1px;
}

.theme-btn{
  border:1px solid var(--border);
  background:var(--card);
  border-radius:10px;
  width:40px;height:40px;
}

/* Dark mode */
body.dark{
  --text:#e5e7eb;
  --muted:#94a3b8;
  --bg:#0b1120;
  --card:#172033;
  --border:#334155;
}
body.dark .header{background:rgba(15,23,42,.97)}
body.dark input,body.dark textarea,body.dark select{background:var(--card);color:var(--text)}

/* =========================================================
   CONVERTER PAGE STYLES
   ========================================================= */
header.converter-header{background:linear-gradient(135deg,#2563eb,#1769aa);color:#fff;padding:24px 16px}
header.converter-header h1{max-width:1050px;margin:0 auto;font-size:28px}
header.converter-header p{max-width:1050px;margin:6px auto 0;opacity:.9}
.wrap{max-width:1050px;margin:20px auto;padding:0 14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 5px 20px #102a430d}
.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}
.tabs{margin-bottom:14px}
button.btn-action{border:0;border-radius:9px;padding:10px 14px;background:#e9eef5;color:#172033;font-weight:700;cursor:pointer}
button.btn-action.primary{background:var(--primary);color:#fff}
button.btn-action:hover{filter:brightness(.97)}
textarea.converter-text{width:100%;min-height:230px;resize:vertical;border:1px solid var(--border);border-radius:10px;padding:14px;font:22px/1.7 "Hind Siliguri",sans-serif;outline:0}
textarea.converter-text:focus{border-color:var(--primary);box-shadow:0 0 0 3px #1769aa20}
.label{font-weight:700;margin:8px 0}
.status{font-size:13px;color:var(--muted);margin-top:9px}
.note{font-size:13px;color:var(--muted);line-height:1.6}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px 0 25px}
</style>
</head>

const PRE_KAR = new Set(["ি","ৈ","ে"]);
const POST_KAR = new Set(["া","ো","ৌ","ৗ","ু","ূ","ী","ৃ"]);
const KAR = new Set([...PRE_KAR,...POST_KAR]);
const BANJONBORNO = new Set("কখগঘঙচছজঝঞটঠডঢণতথদধনপফবভমশষসহযরলয়ড়ঢ়ৎ".split(""));
const NUKTA = new Set(["ং","ঃ","ঁ"]);
const HALANT = "্";
const SPACE = new Set([" ","\t","\n","\r"]);

function isPreKar(c){return PRE_KAR.has(c)}
function isPostKar(c){return POST_KAR.has(c)}
function isKar(c){return KAR.has(c)}
function isBanjonborno(c){return BANJONBORNO.has(c)}
function isNukta(c){return NUKTA.has(c)}
function isHalant(c){return c===HALANT}
function isSpace(c){return SPACE.has(c)}

function rearrangeUnicodeConvertedText(text){
  for(let i=0;i<text.length;i++){
    if(i>0 && text.charAt(i)===HALANT && (isKar(text.charAt(i-1)) || isNukta(text.charAt(i-1))) && i<text.length-1){
      text=text.substring(0,i-1)+text.charAt(i)+text.charAt(i+1)+text.charAt(i-1)+text.substring(i+2);
    }
    if(i>0 && i<text.length-1 && text.charAt(i)===HALANT && text.charAt(i-1)==="র" && text.charAt(i-2)!==HALANT && isKar(text.charAt(i+1))){
      text=text.substring(0,i-1)+text.charAt(i+1)+text.charAt(i-1)+text.charAt(i)+text.substring(i+2);
    }
    if(i<text.length-1 && text.charAt(i)==="র" && isHalant(text.charAt(i+1)) && !isHalant(text.charAt(i-1))){
      let distance=1;
      while(true){
        if(i-distance<0) break;
        if(isBanjonborno(text.charAt(i-distance)) && isHalant(text.charAt(i-distance-1))){distance+=2;}
        else if(distance===1 && isKar(text.charAt(i-distance))){distance++;}
        else break;
      }
      text=text.substring(0,i-distance)+text.charAt(i)+text.charAt(i+1)+text.substring(i-distance,i)+text.substring(i+2);
      i+=1;
      continue;
    }
    if(i<text.length-1 && isPreKar(text.charAt(i)) && !isSpace(text.charAt(i+1))){
      let distance=1;
      while(isBanjonborno(text.charAt(i+distance))){
        if(isHalant(text.charAt(i+distance+1))) distance+=2;
        else break;
      }
      let rebuilt=text.substring(0,i);
      rebuilt+=text.substring(i+1,i+distance+1);
      let extra=0;
      if(text.charAt(i)==="ে" && text.charAt(i+distance+1)==="ো"){rebuilt+="া";extra=1;}
      else if(text.charAt(i)==="ে" && text.charAt(i+distance+1)==="ৌ"){rebuilt+="ৗ";extra=1;}
      else rebuilt+=text.charAt(i);
      rebuilt+=text.substring(i+distance+extra+1);
      text=rebuilt;
      i+=distance;
    }
    if(i<text.length-1 && text.charAt(i)==="ঁ" && isPostKar(text.charAt(i+1))){
      text=text.substring(0,i)+text.charAt(i+1)+text.charAt(i)+text.substring(i+2);
    }
  }
  return text;
}

function rearrangeUnicodeText(text){
  let boundary=0;
  for(let i=0;i<text.length;i++){
    if(i<text.length && isPreKar(text.charAt(i))){
      let distance=1;
      while(isBanjonborno(text.charAt(i-distance))){
        if(i-distance<0 || i-distance<=boundary) break;
        if(isHalant(text.charAt(i-distance-1))) distance+=2;
        else break;
      }
      text=text.substring(0,i-distance)+text.charAt(i)+text.substring(i-distance,i)+text.substring(i+1);
      boundary=i+1;
      i=boundary-1;
      continue;
    }
    if(i<text.length-1 && isHalant(text.charAt(i)) && text.charAt(i-1)==="র" && !isHalant(text.charAt(i-2))){
      let distance=1, preKarExtra=0;
      while(true){
        if(isBanjonborno(text.charAt(i+distance)) && isHalant(text.charAt(i+distance+1))) distance+=2;
        else if(isBanjonborno(text.charAt(i+distance)) && isPreKar(text.charAt(i+distance+1))){preKarExtra=1;break;}
        else break;
      }
      text=text.substring(0,i-1)+text.substring(i+distance+1,i+distance+preKarExtra+1)+text.substring(i+1,i+distance+1)+text.charAt(i-1)+text.charAt(i)+text.substring(i+distance+preKarExtra+1);
      i+=distance+preKarExtra;
      boundary=i+1;
      continue;
    }
  }
  return text;
}

function replaceMap(text,pairs){
  const buckets = new Map();
  for(const [key,value] of pairs){
    if(!key || key === " ") continue;
    const first = key.charAt(0);
    if(!buckets.has(first)) buckets.set(first,[]);
    if(!buckets.get(first).some(item => item[0] === key)){
      buckets.get(first).push([key,value]);
    }
  }
  for(const list of buckets.values()){
    list.sort((a,b)=>b[0].length-a[0].length);
  }

  let out = "";
  for(let i=0;i<text.length;){
    const candidates = buckets.get(text.charAt(i));
    let matched = false;
    if(candidates){
      for(const [key,value] of candidates){
        if(text.startsWith(key,i)){
          out += value;
          i += key.length;
          matched = true;
          break;
        }
      }
    }
    if(!matched){
      out += text.charAt(i);
      i++;
    }
  }
  return out;
}

function htmlSafeToUnicode(text){
  const re=/&#([0-9A-Fa-f]{4});/;
  let m=re.exec(text);
  while(m!==null){text=text.replace(new RegExp("&#"+m[1]+";","g"),String.fromCharCode(parseInt(m[1],16)));m=re.exec(text)}
  return text;
}

function decomposeBengali(text){
  return text
    .replace(/ো/g,"ো")
    .replace(/ৌ/g,"ৌ")
    .replace(/ড়/g,"ড\u09BC")
    .replace(/ঢ়/g,"ঢ\u09BC")
    .replace(/য়/g,"য\u09BC");
}

function convertAnsiToUnicode(text){
  text=replaceMap(text,ANSI_TO_UNICODE);
  text=rearrangeUnicodeConvertedText(text);
  return text.replace(/অা/g,"আ");
}

function convertUnicodeToAnsi(text){
  text=htmlSafeToUnicode(text);
  text=decomposeBengali(text);
  text=text.replace(/ড\u09BC/g,"ড়").replace(/ঢ\u09BC/g,"ঢ়");
  text=text.replace(/&#([0-9A-Fa-f]{4});/g,(_,hex)=>String.fromCharCode(parseInt(hex,16)));
  text=decomposeBengali(text);
  text=text.replace(/ড\u09BC/g,"ড়").replace(/ঢ\u09BC/g,"ঢ়").replace(/য\u09BC/g,"য়");
  text=rearrangeUnicodeText(text);
  return replaceMap(text,UNICODE_TO_ANSI);
}

let mode="a2u";
const input=document.getElementById("input"), output=document.getElementById("output"), status=document.getElementById("status");

function updateMode(){
  document.getElementById("a2u").classList.toggle("primary",mode==="a2u");
  document.getElementById("u2a").classList.toggle("primary",mode==="u2a");
  document.getElementById("inputLabel").textContent=mode==="a2u"?"Perfect Typist New Ttf Font text":"Unicode Bengali text";
  input.placeholder=mode==="a2u"?"এখানে Perfect Typist (ttf) লেখা পেস্ট করুন...":"এখানে Unicode বাংলা লেখা পেস্ট করুন...";
}

document.getElementById("a2u").onclick=()=>{mode="a2u";updateMode()};
document.getElementById("u2a").onclick=()=>{mode="u2a";updateMode()};
document.getElementById("convert").onclick=()=>{output.value=mode==="a2u"?convertAnsiToUnicode(input.value):convertUnicodeToAnsi(input.value);status.textContent="Converted."};
document.getElementById("swap").onclick=()=>{let t=input.value;input.value=output.value;output.value=t;mode=mode==="a2u"?"u2a":"a2u";updateMode()};
document.getElementById("copy").onclick=async()=>{if(!output.value)return;try{await navigator.clipboard.writeText(output.value)}catch(_){output.select();document.execCommand("copy")}status.textContent="Output copied."};
document.getElementById("clear").onclick=()=>{input.value="";output.value="";status.textContent="Cleared."};

/* Theme Toggle Helper */
function toggleTheme(){
  document.body.classList.toggle("dark");
  localStorage.setItem("fontHubTheme", document.body.classList.contains("dark") ? "dark" : "light");
}

document.addEventListener("DOMContentLoaded", () => {
  if (localStorage.getItem("fontHubTheme") === "dark") {
    document.body.classList.add("dark");
  }
  updateMode();
});
