name: Update Download Counts

on:
  repository_dispatch:
    types: [increment-download]

permissions:
  contents: write

jobs:
  update-count:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update JSON Download Count
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const fontName = context.payload.client_payload.font_name;
            const filePath = './downloads.json';

            let data = {};
            if (fs.existsSync(filePath)) {
              data = JSON.parse(fs.readFileSync(filePath, 'utf8'));
            }

            data[fontName] = (data[fontName] || 0) + 1;
            fs.writeFileSync(filePath, JSON.stringify(data, null, 2));
            console.log(`Updated ${fontName} to ${data[fontName]}`);

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads.json
          git status
          git diff-index --quiet HEAD || git commit -m "chore: increment download count [skip ci]"
          git push
